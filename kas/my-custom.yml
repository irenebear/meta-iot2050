header:
  version: 14

local_conf_header:
  custom-support: |
    IOT2050_CUSTOM_SUPPORT = "1"
  kernel-mirror: |
    # 内核源码下载：cdn.kernel.org 在 runner 上不可达 → 走备用域名（失败自动回退）
    PREMIRRORS:append = " \
        https://cdn\.kernel\.org/(.*) https://www\.kernel\.org/\1 \n \
        https://cdn\.kernel\.org/(.*) https://mirrors\.edge\.kernel\.org/\1 \n \
        "
    # 强制 wget 走 IPv4 —— 必须完整赋值！Isar 里 FETCHCMD_wget 默认值为空，
    # 用 :append 会得到只有 " -4" 的命令（exit 127 command not found）
    FETCHCMD_wget = "/usr/bin/env wget -t 2 -T 30 -4"
